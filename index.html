<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f4"><title>Realistic Flipbook Demo</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="top"><div><div class="eyebrow">DIGITAL CATALOG · REALISTIC PAGE FLIP</div><h1 id="title">E-Catalog</h1></div><div class="top-actions"><button id="full" title="Fullscreen" aria-label="Fullscreen">⛶ Fullscreen</button></div></header>
<section class="viewer" id="viewer" aria-label="Flipbook viewer"><div id="book" class="book"></div><div id="status" role="status" class="status" hidden></div></section>
<footer class="toolbar"><button id="prev" aria-label="Previous page">← <span>Previous</span></button><div class="page-jump"><label for="page">Page</label><select id="page" aria-label="Go to page"></select><span id="total"></span></div><button id="next" aria-label="Next page"><span>Next</span> →</button></footer><p class="hint">Drag a page corner to flip · Swipe on mobile · Use ← → keys</p></main>
<script src="config.js"></script><script src="app.js"></script></body></html>
