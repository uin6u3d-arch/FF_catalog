<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f4"><title>E-Catalog</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div><div class="eyebrow">DIGITAL CATALOG</div><h1 id="title">E-Catalog</h1></div><div class="top-actions"><button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="full" aria-label="Fullscreen">⛶</button></div></header><section class="viewer" id="viewer" aria-label="Catalog viewer"><div class="spread" id="spread" aria-live="polite"></div></section><footer class="toolbar"><button id="prev" aria-label="Previous page">← <span>Previous</span></button><div class="page-jump"><label for="page">Page</label><select id="page" aria-label="Go to page"></select><span id="total"></span></div><button id="next" aria-label="Next page"><span>Next</span> →</button></footer><p class="hint">Swipe or use arrow keys to navigate · Double-click an image to zoom</p></main><script src="config.js"></script><script src="app.js"></script></body></html>
